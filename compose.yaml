services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: consult
      POSTGRES_DB: consult
      POSTGRES_PASSWORD: consult
    volumes:
      - pgdata:/var/lib/postgresql/data
  jaeger:                            # 추적 보기용. docker compose --profile observability up -d 일 때만 뜬다
    image: jaegertracing/jaeger:2.11.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"      # 화면. 같은 망의 다른 사람이 추적을 보지 못하게 이 컴퓨터에만 연다
      - "127.0.0.1:4318:4318"        # OTLP HTTP 수신
volumes:
  pgdata:
