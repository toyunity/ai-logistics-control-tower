spring:
  application.name: consult
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/consult}
    username: ${DB_USER:consult}
    password: ${DB_PASSWORD:consult}
  mvc.async.request-timeout: 180s   # Tomcat 기본 30초면 긴 답변이 잘린다
  ai:
    model:
      chat: anthropic
      embedding: openai
      image: none
      moderation: none
      audio.speech: none
      audio.transcription: none
    anthropic.api-key: ${ANTHROPIC_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding.options.model: text-embedding-3-small
    vectorstore.pgvector:
      initialize-schema: true
      id-type: TEXT                 # 기본값 UUID이면 "refund-policy" 같은 ID가 실패한다
      dimensions: 1536
    chat.memory.repository.jdbc.initialize-schema: always
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR   # WARN은 거부된 사용자 입력을 그대로 남긴다
consult:
  chat-model: claude-opus-5-5
  rewrite-model: claude-opus-5-5    # 지연 절감 수단: 측정 후 claude-haiku-5-5
  max-tokens: 16000
  top-k: 3
  similarity-threshold: 0.4         # Task 7 평가로 보정한다
