spring:
  application.name: control-tower
  autoconfigure.exclude: org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration   # 켜 두면 Gemini와 임베딩 빈이 둘이 된다. 임베딩은 Gemini만 쓴다
  task.scheduling.pool.size: 4       # 기본값 1이면 느린 이벤트 전송이 시뮬레이터 틱과 감지까지 막는다
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/consult}
    username: ${DB_USER:consult}
    password: ${DB_PASSWORD:consult}
    hikari.data-source-properties.logServerErrorDetail: false   # true면 pgjdbc 예외 메시지에 사용자 입력이 그대로 들어간다
  sql.init:
    mode: always                    # 기본값 embedded면 PostgreSQL에서 관제 스키마가 만들어지지 않는다
    schema-locations: classpath:schema-control.sql
  ai:
    model:
      chat: anthropic
      embedding.text: google-genai
      image: none
      moderation: none
      audio.speech: none
      audio.transcription: none
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      timeout: 10m                  # 응답 전체 시간 한도. 기본값 60초면 긴 답변이 잘린다
    google.genai.embedding:
      api-key: ${GEMINI_API_KEY}
      text.options:
        model: gemini-embedding-001
        dimensions: 1536            # pgvector 테이블 차원과 같아야 한다. 기본값(3072)이면 저장이 실패한다
    vectorstore.pgvector:
      initialize-schema: true
      id-type: TEXT                 # 기본값 UUID이면 "refund-policy" 같은 ID가 실패한다
      dimensions: 1536
    chat.memory.repository.jdbc.initialize-schema: always
    chat.client.tool-calling.advisor-order: 20   # 기본값은 메모리(0)와 RAG(10) 바깥이라 도구 반복마다 검색과 재작성이 다시 돈다
server.reactive.session.cookie.same-site: lax   # 다른 사이트에서 보낸 확정 POST에 세션 쿠키가 실리지 않게 한다. WebFlux 기본값도 Lax지만 의도를 고정한다
logging.level.org.springframework.ai.tool.method.MethodToolCallback: ERROR   # 인자 변환 실패 WARN이 모델이 보낸 인자 값을 그대로 남긴다
logging.level.org.springframework.ai.model.tool.DefaultToolCallingManager: ERROR   # 없는 도구 WARN이 모델이 만든 도구 이름을 그대로 남긴다
logging.level.org.springframework.ai.chat.model.MessageAggregator: OFF   # 스트림 실패를 예외 문구째 ERROR로 남긴다. 실패는 AssistantChatService가 클래스 이름으로 남긴다
controltower:
  chat-model: claude-opus-5-5
  rewrite-model: claude-opus-5-5    # 지연을 줄여야 하면 측정 후 claude-haiku-5-5로 바꾼다
  max-tokens: 8000                  # 끊긴 클라이언트의 답변 1건에 드는 비용 상한이기도 하다(docs/operations.md 한계 참고)
  embedding-index: ${spring.ai.google.genai.embedding.text.options.model}-${spring.ai.google.genai.embedding.text.options.dimensions}   # 지식 문서 해시에 포함된다. 바뀌면 전체를 다시 임베딩한다
  top-k: 3
  similarity-threshold: 0.60        # 실측(Gemini 1536차원): 정답 최저 0.674, 무관 최고 0.531의 가운데. LocalModelIT·LiveApiIT 표로 다시 잰다
  stream-idle-timeout: 60s          # 첫 청크까지의 대기와 청크 사이 침묵 한도. 총 시간 한도는 spring.ai.anthropic.timeout
  cutoff: "18:00"                   # 출고 마감 시각(서버 시간대). 가상의 값이며 장애 등급 계산에 쓴다
  detection.enabled: true           # 5초 주기 감지. 끄면 이벤트 수신 때만 감지한다
  equipment.circuit-breaker:         # 설비군(컨베이어, 분류기, 로봇, 안전 PLC)마다 하나. 읽기와 명령 전송이 같은 회로를 쓴다
    sliding-window-size: 6            # 최근 6건(최소 호출 수도 6)을 본다. 컨베이어 조회 한 번이 3건이라 무응답 조회 두 번이면 열린다
    failure-rate-threshold: 50        # %. 연결 실패, 타임아웃, 5xx만 센다. 4xx는 기기가 답한 것이라 세지 않는다
    wait-in-open-state: 10s           # 이 동안은 설비가 회복돼도 UNKNOWN이고 명령은 보내지 않는다. 감지 주기(5초) 두 번
    half-open-calls: 3                # 컨베이어 조회 한 번(3건)이 그대로 시험 호출이 된다
  simulator:
    enabled: true
    event-target: ""                # 비우면 실행 중인 서버 자신의 포트로 보낸다
